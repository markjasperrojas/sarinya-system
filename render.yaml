services:
  - type: web
    name: sarinya-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — set these manually in the Render dashboard, never commit values
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Your Vercel frontend URL, e.g. https://sarinya-system.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
